[project]
name = "tsamai"
version = "0.1.0"
description = "TsamAI — a from-scratch character-level GPT with a native desktop playground"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "requests>=2.31",
    "PySide6>=6.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
